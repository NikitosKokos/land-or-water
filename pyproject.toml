[project]
name = "land-or-water"
version = "0.1.0"
description = "Ask Claude models 'Land or Water?' at every point of a lat/lon grid and plot what they see."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.6,<3",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "global-land-mask>=1.0",
]

[project.scripts]
landwater = "landwater.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["landwater"]
